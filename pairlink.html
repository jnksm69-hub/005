<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PairLink</title>
<style>
  :root { --bg:#f4f6f7; --card:#fff; --text:#1c2428; --sub:#5d6b73; --line:#d5dce0; --acc:#0a6b86; --acc-t:#fff; --ok:#1b8a5a; --ng:#c0452f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181b; --card:#1b2327; --text:#e4eaed; --sub:#93a2aa; --line:#2f3b41; --acc:#4fb4d2; --acc-t:#07232c; --ok:#4cc38a; --ng:#e5694f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.6;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header, main, footer { max-width: 720px; margin: 0 auto; padding: 12px 16px; }
  header { display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:15px; margin:20px 0 6px; }
  p { margin:6px 0; }
  .note { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px 16px 16px; margin:14px 0; }
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:9px 14px; cursor:pointer; }
  button.primary { background:var(--acc); color:var(--acc-t); border-color:var(--acc); font-weight:600; }
  button.link { border:0; background:none; color:var(--sub); text-decoration:underline; padding:4px 0; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  input[type=text] { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; width:100%; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #qr img { max-width:240px; width:100%; height:auto; image-rendering:pixelated; background:#fff; padding:6px; border-radius:6px; }
  #linkTxt { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; color:var(--sub); }
  #st.ok, #sg.ok { color:var(--ok); } #st.ng, #sg.ng { color:var(--ng); }
  #stage { position:relative; background:#000; border-radius:8px; margin-top:12px; }
  #v { width:100%; max-height:70vh; display:block; background:#000; }
  #stage button { position:absolute; right:8px; bottom:8px; }
  #drop { border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--sub); margin-top:10px; }
  #drop.over { border-color:var(--acc); color:var(--acc); }
  ul#items { list-style:none; padding:0; margin:10px 0 0; }
  ul#items li { padding:7px 0; border-top:1px solid var(--line); font-size:14px; word-break:break-all; }
  #msg { min-height:1.6em; color:var(--sub); font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>PairLink</h1>
  <span class="note" id="roleTag"></span>
  <button class="link" id="roleBtn" type="button" hidden>役割を変える</button>
</header>

<main>
  <section id="choose" class="card" hidden>
    <h2>この端末の役割を選んでください</h2>
    <div class="row">
      <button class="primary" id="asPc" type="button">PC(画面を共有する側)</button>
      <button class="primary" id="asPhone" type="button">スマホ(見る側)</button>
    </div>
  </section>

  <section id="pcPanel" class="card" hidden>
    <h2>1. ペアリング</h2>
    <p>スマホでこのQRコードを読み取ると、この2台だけがつながります。</p>
    <div id="qr"></div>
    <p id="linkTxt"></p>
    <div class="row">
      <button id="copyLink" type="button">コピー</button>
      <button id="newKey" type="button">鍵を作り直す</button>
    </div>
    <p class="note" id="linkNote"></p>
    <h2>2. 画面共有</h2>
    <p id="shareSt">まだ共有していません。</p>
    <div class="row"><button class="primary" id="shareBtn" type="button">画面共有を開始</button></div>
    <p class="note">このページは開いたままにしてください。スマホがつなぎに来ると、自動で応答します。共有を始める前につないだ場合は、スマホで「つなぎ直す」を押してください。</p>
  </section>

  <section id="phPanel" class="card" hidden>
    <div id="keyBox" hidden>
      <h2>ペアリング</h2>
      <p>PCに表示されたQRコードをカメラで読み取るか、リンク(または鍵)をここに貼り付けてください。</p>
      <input type="text" id="keyIn" placeholder="リンクまたは鍵" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="primary" id="keyOk" type="button">登録</button></div>
    </div>
    <div id="connBox" hidden>
      <h2>PCにつなぐ</h2>
      <div class="row">
        <button class="primary" id="connBtn" type="button">つなぐ</button>
        <button id="discBtn" type="button">切断</button>
      </div>
    </div>
    <div id="stage" hidden><video id="v" autoplay playsinline muted></video><button id="fsBtn" type="button">全画面</button></div>
  </section>

  <section id="filePanel" class="card" hidden>
    <h2>ファイル転送</h2>
    <p id="fileSt" class="note">つながると使えます。</p>
    <input type="file" id="fin" multiple>
    <div id="drop">ここにファイルをドロップ</div>
    <ul id="items"></ul>
  </section>

  <p>接続: <span id="st">未接続</span> / 連絡経路: <span id="sg">未接続</span></p>
  <p id="msg" role="status"></p>
</main>

<footer>
  <button class="link" id="forget" type="button" hidden>ペアリングを解除</button>
</footer>

function b64uEnc(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64uDec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function hex(u8) { return Array.from(u8, b => b.toString(16).padStart(2, '0')).join(''); }
async function pipe(u8, stream) { const w = stream.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); }
const deflate = u8 => pipe(u8, new CompressionStream('deflate-raw'));
const inflate = u8 => pipe(u8, new DecompressionStream('deflate-raw'));
let KEY = null, TOPIC = null, keyB64 = null;
async function useKey(b64) {
  const raw = b64uDec(b64);
  if (raw.length !== 32) throw new Error('鍵の形式が正しくありません');
  KEY = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  const t = new Uint8Array(raw.length + 5); t.set(raw); t.set(enc.encode('topic'), raw.length);
  TOPIC = 'pl' + hex(new Uint8Array(await crypto.subtle.digest('SHA-256', t))).slice(0, 40);
  keyB64 = b64;
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await deflate(enc.encode(JSON.stringify(obj)));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, data));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return b64uEnc(out);
}
async function unseal(text) {
  const raw = b64uDec(text.trim());
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, KEY, raw.slice(12));
  return JSON.parse(dec.decode(await inflate(new Uint8Array(pt))));
}
//#helpers-end

let role = '', stream = null, pc = null, dc = null, sid = null;
let pend = [], iceBuf = [], iceTimer = null, rx = null, attemptTimer = null;
const seen = new Set();
const v = $('#v');

// ---------- 連絡経路(ntfy経由・暗号化) ----------
const me = () => (role === 'pc' ? 'pc' : 'ph');
async function sig(obj) {
  obj.from = me(); obj.ts = Date.now();
  const r = await fetch(SIGNAL + '/' + TOPIC, { method: 'POST', body: await seal(obj) });
  if (!r.ok) throw new Error('signal ' + r.status);
}
function setSig(ok) { const e = $('#sg'); e.textContent = ok ? 'OK' : '再接続中…'; e.className = ok ? 'ok' : 'ng'; }

let listening = false, since = '';
let queue = Promise.resolve();
async function listen() {
  if (listening) return;
  listening = true;
  since = String(Math.floor(Date.now() / 1000) - (role === 'pc' ? 30 : 3));
  while (listening) {
    try {
      const res = await fetch(SIGNAL + '/' + TOPIC + '/json?since=' + encodeURIComponent(since));
      if (!res.ok) throw new Error(res.status);
      setSig(true);
      const rd = res.body.getReader(), td = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        buf += td.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) onLine(line); }
      }
    } catch (e) { /* 少し待って再接続 */ }
    setSig(false);
    await sleep(3000);
  }
}
function onLine(line) {
  let j; try { j = JSON.parse(line); } catch (e) { return; }
  if (j.event !== 'message') return;
  if (j.id) since = j.id;
  queue = queue.then(() => onSignal(j.message)).catch(() => {});
}
async function onSignal(text) {
  let m; try { m = await unseal(text); } catch (e) { return; } // 鍵が違う・壊れている
  if (!m || Math.abs(Date.now() - m.ts) > 300000 || m.from === me()) return;
  if (role === 'pc') await pcHandle(m); else await phHandle(m);
}

// ---------- WebRTC共通 ----------
function newPeer() {
  closePeer();
  pc = new RTCPeerConnection({ iceServers: ICE });
  const mine = pc;
  pc.onicecandidate = e => {
    if (mine !== pc) return;
    if (e.candidate) { iceBuf.push(e.candidate.toJSON()); if (!iceTimer) iceTimer = setTimeout(flushIce, 400); }
    else flushIce();
  };
  pc.onconnectionstatechange = () => { if (mine === pc) onConn(); };
  onConn();
}
function flushIce() {
  clearTimeout(iceTimer); iceTimer = null;
  if (!iceBuf.length) return;
  const c = iceBuf; iceBuf = [];
  sig({ t: 'ice', sid, c }).catch(() => {});
}
function closePeer() {
  clearTimeout(iceTimer); iceTimer = null; iceBuf = []; pend = []; rx = null;
  if (dc) { try { dc.close(); } catch (e) {} } dc = null;
  if (pc) { pc.onconnectionstatechange = null; try { pc.close(); } catch (e) {} } pc = null;
  setFileReady(false);
  if (role !== 'pc') { v.srcObject = null; show($('#stage'), false); }
}
async function addIce(list) {
  for (const c of list || []) {
    if (pc && pc.remoteDescription) { try { await pc.addIceCandidate(c); } catch (e) {} } else pend.push(c);
  }
}
async function drain() { while (pend.length && pc) { try { await pc.addIceCandidate(pend.shift()); } catch (e) {} } }
function onConn() {
  const s = pc ? pc.connectionState : 'closed';
  const map = { new: '準備中…', connecting: '接続しています…', connected: '接続中', disconnected: '切れました', failed: 'つながりませんでした', closed: role === 'pc' ? '待機中(スマホを待っています)' : '未接続' };
  const e = $('#st'); e.textContent = map[s] || s; e.className = s === 'connected' ? 'ok' : (s === 'failed' || s === 'disconnected' ? 'ng' : '');
  if (s === 'connected') { clearTimeout(attemptTimer); setMsg(''); }
  if (s === 'failed') setMsg('直接つながりませんでした。回線(会社のネットワークや携帯回線)の制限で、この方式が使えない可能性があります。');
}

// ---------- PC側 ----------
async function pcHandle(m) {
  if (m.t === 'hello') {
    if (seen.has(m.sid) || Date.now() - m.ts > 120000) return;
    seen.add(m.sid);
    sid = m.sid; newPeer();
    dc = pc.createDataChannel('f'); setupDC(dc);
    if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const off = await pc.createOffer();
    await pc.setLocalDescription(off);
    await sig({ t: 'offer', sid, sdp: pc.localDescription.sdp });
  } else if (m.t === 'answer' && m.sid === sid && pc && !pc.remoteDescription) {
    await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
    await drain();
  } else if (m.t === 'ice' && m.sid === sid && pc) {
    await addIce(m.c);
  }
}
async function startShare() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { setMsg('このブラウザでは画面共有を使えません(PCのChromeやEdgeを使ってください)。'); return; }
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 10, max: 15 } }, audio: false });
  } catch (e) { setMsg('画面共有を開始できませんでした。'); return; }
  const t = stream.getVideoTracks()[0];
  try { t.contentHint = 'detail'; } catch (e) {}
  t.onended = () => { stream = null; renderShare(); };
  renderShare();
}
function stopShare() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; renderShare(); }
function renderShare() {
  $('#shareSt').textContent = stream ? '共有中です。' : 'まだ共有していません。';
  $('#shareBtn').textContent = stream ? '共有を停止' : '画面共有を開始';
}

// ---------- スマホ側 ----------
async function phHandle(m) {
  if (m.sid !== sid || !pc) return;
  if (m.t === 'offer' && !pc.remoteDescription) {
    await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
    await drain();
    const a = await pc.createAnswer();
    await pc.setLocalDescription(a);
    await sig({ t: 'answer', sid, sdp: a.sdp });
  } else if (m.t === 'ice') {
    await addIce(m.c);
  }
}
function phConnect(n) {
  n = n || 1;
  clearTimeout(attemptTimer);
  sid = b64uEnc(crypto.getRandomValues(new Uint8Array(9)));
  newPeer();
  pc.ondatachannel = e => { dc = e.channel; setupDC(dc); };
  pc.ontrack = e => { v.srcObject = e.streams[0] || new MediaStream([e.track]); show($('#stage'), true); v.play().catch(() => {}); };
  listen();
  setMsg('PCを呼び出しています…');
  sig({ t: 'hello', sid }).catch(() => setMsg('連絡経路につながりません。ネットワークを確認してください。'));
  attemptTimer = setTimeout(() => {
    if (pc && pc.connectionState !== 'connected') {
      if (n < 3) phConnect(n + 1);
      else setMsg('PCが応答しません。PC側のページが開いているか、確認してください。');
    }
  }, 10000);
}

// ---------- ファイル転送 ----------
const CH = 16384;
function setupDC(ch) {
  ch.binaryType = 'arraybuffer';
  ch.onopen = () => setFileReady(true);
  ch.onclose = () => setFileReady(false);
  ch.onmessage = onData;
}
function setFileReady(ok) {
  $('#fin').disabled = !ok;
  $('#fileSt').textContent = ok ? 'ファイルを選ぶか、ドロップすると相手へ送れます。' : 'つながると使えます。';
}
function addItem(dir, name) { const li = document.createElement('li'); li.textContent = dir + ': ' + name; $('#items').prepend(li); return li; }
function onData(e) {
  if (typeof e.data === 'string') {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.k === 'meta') rx = { name: String(m.name || 'file'), size: m.size || 0, type: m.type || 'application/octet-stream', parts: [], got: 0, li: addItem('受信中', m.name) };
    else if (m.k === 'end' && rx) {
      const url = URL.createObjectURL(new Blob(rx.parts, { type: rx.type }));
      rx.li.textContent = '受信: ' + rx.name + ' ';
      const a = document.createElement('a'); a.href = url; a.download = rx.name; a.textContent = '保存'; rx.li.appendChild(a);
      rx = null;
    }
  } else if (rx) {
    rx.parts.push(e.data); rx.got += e.data.byteLength;
    rx.li.textContent = '受信中: ' + rx.name + ' ' + Math.floor(rx.got * 100 / (rx.size || 1)) + '%';
  }
}
async function sendFile(f) {
  if (!dc || dc.readyState !== 'open') { setMsg('つながっていないため送れません。'); return; }
  const ch = dc, li = addItem('送信中', f.name);
  ch.send(JSON.stringify({ k: 'meta', name: f.name, size: f.size, type: f.type }));
  ch.bufferedAmountLowThreshold = 1 << 20;
  let off = 0;
  while (off < f.size) {
    if (ch.readyState !== 'open') { li.textContent = '中断: ' + f.name; return; }
    if (ch.bufferedAmount > (4 << 20)) await new Promise(r => ch.addEventListener('bufferedamountlow', r, { once: true }));
    const buf = await f.slice(off, off + CH).arrayBuffer();
    ch.send(buf); off += buf.byteLength;
    li.textContent = '送信中: ' + f.name + ' ' + Math.floor(off * 100 / f.size) + '%';
  }
  ch.send(JSON.stringify({ k: 'end' }));
  li.textContent = '送信完了: ' + f.name;
}
let sendChain = Promise.resolve();
function queueFiles(files) { for (const f of files) sendChain = sendChain.then(() => sendFile(f)).catch(() => {}); }

// ---------- 画面の表示 ----------
function renderPairing() {
  const link = /^https?:$/.test(location.protocol) ? location.origin + location.pathname + '#k=' + keyB64 : keyB64;
  const q = qrcode(0, 'M'); q.addData(link); q.make();
  $('#qr').innerHTML = q.createImgTag(6, 4);
  $('#linkTxt').textContent = link;
  $('#linkNote').textContent = /^https?:$/.test(location.protocol)
    ? 'このQRコードとリンクには、2台をつなぐ鍵が含まれます。他の人に見せないでください。'
    : 'このページをファイルとして開いているため、QRコードには鍵だけが入っています。スマホ側は、同じページをWebで開いて、鍵を貼り付けてください。';
}
async function render() {
  show($('#choose'), !role);
  show($('#roleBtn'), !!role); show($('#forget'), !!role);
  $('#roleTag').textContent = role === 'pc' ? 'PC(共有する側)' : role === 'phone' ? 'スマホ(見る側)' : '';
  show($('#pcPanel'), role === 'pc'); show($('#phPanel'), role === 'phone');
  show($('#filePanel'), !!role);
  setFileReady(false);
  if (role === 'pc') {
    if (!keyB64) { await useKey(b64uEnc(crypto.getRandomValues(new Uint8Array(32)))); store.set('pl.key', keyB64); }
    renderPairing(); renderShare(); onConn(); listen();
  } else if (role === 'phone') {
    show($('#keyBox'), !keyB64); show($('#connBox'), !!keyB64);
  }
}

// ---------- 操作 ----------
$('#asPc').onclick = () => { store.set('pl.role', 'pc'); location.reload(); };
$('#asPhone').onclick = () => { store.set('pl.role', 'phone'); location.reload(); };
$('#roleBtn').onclick = () => { store.del('pl.role'); location.reload(); };
$('#forget').onclick = () => { if (confirm('ペアリングを解除します。よろしいですか?')) { store.del('pl.key'); store.del('pl.role'); location.reload(); } };
$('#shareBtn').onclick = () => (stream ? stopShare() : startShare());
$('#newKey').onclick = async () => {
  if (!confirm('鍵を作り直すと、いまのスマホはつながらなくなります。よろしいですか?')) return;
  listening = false; closePeer();
  await useKey(b64uEnc(crypto.getRandomValues(new Uint8Array(32)))); store.set('pl.key', keyB64);
  renderPairing(); setMsg('新しい鍵を作りました。スマホで読み取り直してください。');
  setTimeout(listen, 100);
};
$('#copyLink').onclick = async () => { try { await navigator.clipboard.writeText($('#linkTxt').textContent); setMsg('コピーしました。'); } catch (e) { setMsg('コピーできませんでした。文字を長押ししてコピーしてください。'); } };
$('#keyOk').onclick = async () => {
  const m = $('#keyIn').value.match(/[#&?]k=([A-Za-z0-9_-]{43})|^\s*([A-Za-z0-9_-]{43})\s*$/);
  const k = m && (m[1] || m[2]);
  if (!k) { setMsg('リンクまたは鍵の形式が正しくありません。'); return; }
  try { await useKey(k); store.set('pl.key', k); setMsg(''); render(); } catch (e) { setMsg(e.message); }
};
$('#connBtn').onclick = () => { $('#connBtn').textContent = 'つなぎ直す'; phConnect(1); };
$('#discBtn').onclick = () => { clearTimeout(attemptTimer); closePeer(); onConn(); setMsg(''); };
$('#fsBtn').onclick = () => { const s = $('#stage'); (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s); };
$('#fin').onchange = e => { queueFiles(Array.from(e.target.files)); e.target.value = ''; };
const drop = $('#drop');
['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => queueFiles(Array.from(e.dataTransfer.files)));

(async function init() {
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) { setMsg('このページは安全な接続(https)で開く必要があります。'); return; }
  const h = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  try {
    if (h) { await useKey(h[1]); store.set('pl.key', h[1]); store.set('pl.role', 'phone'); history.replaceState(null, '', location.pathname + location.search); }
    else { const k = store.get('pl.key'); if (k) await useKey(k); }
  } catch (e) { store.del('pl.key'); keyB64 = null; }
  role = store.get('pl.role') || '';
  render();
})();
})();
</script>
